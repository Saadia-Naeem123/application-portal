# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys the backend as a web service plus a managed Postgres database.
# In the Render dashboard: New -> Blueprint -> point at this repo.
# (You can still deploy manually without this file — see README/notes.)

databases:
  - name: university-system-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: university-system-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: university-system-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false # set manually to your Vercel URL(s), comma-separated
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
